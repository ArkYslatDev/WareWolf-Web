<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐺 Werewolf Hago Style</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #1e1338 0%, #0a0512 100%);
            color: white; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
            overflow-x: hidden;
        }
        .card {
            background: rgba(42, 26, 58, 0.8); backdrop-filter: blur(10px);
            padding: 30px; border-radius: 20px; width: 100%; max-width: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { text-align: center; font-size: 28px; text-shadow: 0 0 15px #a855f7; margin-bottom: 20px; }
        h2 { text-align: center; font-size: 22px; margin-bottom: 15px; }
        input, button {
            padding: 15px; border-radius: 12px; border: none; font-family: inherit; font-size: 15px; width: 100%; margin-bottom: 12px;
        }
        input { background: rgba(0,0,0,0.5); color: white; border: 1px solid #4c2a78; text-align: center; }
        input:focus { outline: none; border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.5); }
        button {
            background: linear-gradient(135deg, #a855f7, #7c3aed); color: white; cursor: pointer; font-weight: 600;
            transition: all 0.2s; box-shadow: 0 5px 15px rgba(168,85,247,0.4);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(168,85,247,0.6); }
        button:disabled { background: #555; box-shadow: none; cursor: not-allowed; transform: none; }
        .hidden { display: none !important; }
        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .avatar-option {
            font-size: 32px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px; cursor: pointer;
            text-align: center; border: 2px solid transparent; transition: 0.2s;
        }
        .avatar-option:hover { background: rgba(168,85,247,0.2); }
        .avatar-option.selected { border-color: #22c55e; background: rgba(34,197,94,0.2); box-shadow: 0 0 15px rgba(34,197,94,0.4); }
        .player-list { background: rgba(0,0,0,0.5); border-radius: 12px; padding: 15px; margin: 15px 0; max-height: 250px; overflow-y: auto; }
        .player { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .player:last-child { border-bottom: none; }
        .player-info { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .player-avatar { font-size: 24px; }
        .player.dead { opacity: 0.4; text-decoration: line-through; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: bold; }
        .badge-host { background: #facc15; color: #000; }
        .badge-you { background: #22c55e; color: #000; }
        .target-btn { width: auto; padding: 6px 15px; margin: 0; font-size: 12px; background: #ef4444; border-radius: 8px; }
        .target-btn:hover { background: #dc2626; }
        .timer-bar { background: rgba(0,0,0,0.6); border-radius: 20px; height: 20px; position: relative; overflow: hidden; margin: 15px 0; border: 1px solid #4c2a78; }
        .timer-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #facc15, #ef4444); transition: width 1s linear; border-radius: 20px; }
        .timer-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; text-shadow: 0 0 5px black; }
        .timer-bar.urgent .timer-text { animation: pulse 0.5s infinite; color: #ef4444; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .log-area { height: 120px; overflow-y: auto; background: #0d0714; padding: 12px; border-radius: 12px; font-size: 13px; text-align: left; border: 1px solid #4c2a78; margin-top: 15px; }
        .log-area div { margin-bottom: 6px; animation: slideIn 0.3s; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .chat-box { background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid #4c2a78; margin-top: 15px; overflow: hidden; }
        .chat-header { background: #4c2a78; padding: 10px 15px; display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; }
        .chat-messages { height: 180px; overflow-y: auto; padding: 12px; font-size: 13px; text-align: left; }
        .chat-msg { margin-bottom: 8px; }
        .chat-msg .sender { font-weight: bold; color: #22c55e; }
        .chat-msg.wolf { background: rgba(239,68,68,0.2); border-left: 3px solid #ef4444; padding: 6px; border-radius: 6px; }
        .chat-msg.wolf .sender { color: #ef4444; }
        .chat-msg.dead { background: rgba(136,136,136,0.2); padding: 6px; border-radius: 6px; }
        .chat-input-row { display: flex; border-top: 1px solid #4c2a78; }
        .chat-input-row input { border-radius: 0; margin: 0; flex: 1; background: #1a0f2e; border: none; text-align: left; }
        .chat-input-row button { width: auto; margin: 0; border-radius: 0; padding: 15px 25px; }
        .role-box { text-align: center; padding: 15px; background: rgba(0,0,0,0.5); border-radius: 12px; margin-bottom: 15px; }
        .role-box b { font-size: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h1>🐺 Werewolf Online</h1>

    <div id="menu-section">
        <input type="text" id="name-input" placeholder="Nama Karakter" maxlength="15">
        <p style="text-align:left; font-size:12px; margin-bottom:5px; color:#aaa;">Pilih Avatar:</p>
        <div class="avatar-grid" id="avatar-grid">
            <div class="avatar-option selected" onclick="selectAvatar(this, '👨')">👨</div>
            <div class="avatar-option" onclick="selectAvatar(this, '👩')">👩</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🧙‍♂️')">🧙‍♂️</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🕵️')">🕵️</div>
            <div class="avatar-option" onclick="selectAvatar(this, '👮')">👮</div>
            <div class="avatar-option" onclick="selectAvatar(this, '👻')">👻</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🐺')">🐺</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🤖')">🤖</div>
        </div>
        <button onclick="createRoom()">Buat Room (Host)</button>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <input type="text" id="room-input" placeholder="Kode Room" maxlength="6" style="margin:0;">
            <button onclick="joinRoom()" style="margin:0; width:100px;">Gabung</button>
        </div>
    </div>

    <div id="lobby-section" class="hidden">
        <h2>Kode Room: <span id="room-code-display" style="color:#facc15; letter-spacing:2px;"></span></h2>
        <div id="player-list" class="player-list"></div>
        <button id="start-btn" onclick="startGame()" class="hidden">▶ Mulai Game (Host)</button>
        <p id="waiting-msg" style="text-align:center; color:#facc15;">Menunggu host memulai...</p>
    </div>

    <div id="game-section" class="hidden">
        <h2 id="phase-title" style="color:#facc15; text-shadow: 0 0 10px rgba(250,204,21,0.5);">Fase</h2>
        
        <div class="role-box" id="role-info">Peranmu: <b>???</b></div>

        <div id="timer-bar" class="timer-bar hidden">
            <div id="timer-fill" class="timer-fill" style="width: 100%;"></div>
            <div id="timer-text" class="timer-text">0s</div>
        </div>

        <div id="witch-panel" class="hidden" style="background: rgba(168,85,247,0.1); padding: 15px; border-radius: 12px; border: 1px solid #a855f7; margin-bottom: 15px;">
            <h3 style="color: #a855f7; font-size: 16px; margin-bottom: 10px; text-align:center;">🧪 Ramuan Penyihir</h3>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="btn-heal" onclick="useWitchPotion('heal')" style="background: #3b82f6; font-size: 12px; padding: 10px; margin:0;">💚 Sembuhkan</button>
                <button id="btn-poison" onclick="useWitchPotion('poison')" style="background: #ef4444; font-size: 12px; padding: 10px; margin:0;">☠️ Racuni</button>
            </div>
        </div>

        <div id="action-area">
            <p id="action-desc" style="text-align:center; margin-bottom:10px; color:#aaa;">Pilih pemain:</p>
            <div id="target-list" class="player-list"></div>
        </div>

        <div id="log-area" class="log-area"></div>
        <button id="play-again-btn" onclick="playAgain()" class="hidden" style="margin-top: 15px; background:#22c55e;">🔄 Main Lagi</button>
    </div>

    <div id="chat-section" class="hidden">
        <div class="chat-box">
            <div class="chat-header">
                <span>💬 Chat</span>
                <span id="chat-channel-label" style="color:#facc15;">PUBLIK</span>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Ketik pesan..." maxlength="200" onkeydown="if(event.key==='Enter') sendChat()">
                <button onclick="sendChat()">Kirim</button>
            </div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io({ transports: ['websocket', 'polling'] });
    let myName = "";
    let myId = null;
    let myAvatar = '👨';
    let isHost = false;
    let hasVoted = false;
    let timerInterval = null;
    
    let currentWitchAction = null; 
    let witchUsed = false;

    socket.on('connect', () => { myId = socket.id; });

    function selectAvatar(el, emoji) {
        document.querySelectorAll('.avatar-option').forEach(e => e.classList.remove('selected'));
        el.classList.add('selected');
        myAvatar = emoji;
    }

    function createRoom() {
        myName = document.getElementById('name-input').value.trim();
        if (!myName) return alert("Masukkan nama!");
        socket.emit('createRoom', { playerName: myName, avatar: myAvatar });
    }

    function joinRoom() {
        myName = document.getElementById('name-input').value.trim();
        const code = document.getElementById('room-input').value.trim().toUpperCase();
        if (!myName) return alert("Masukkan nama!");
        if (!code) return alert("Masukkan kode room!");
        socket.emit('joinRoom', { roomCode: code, playerName: myName, avatar: myAvatar });
    }

    function startGame() { socket.emit('startGame'); }
    function playAgain() { socket.emit('playAgain'); }

    function sendAction(type, targetId) {
        socket.emit('nightAction', { targetId, actionType: type });
        
        if (type === 'kill' || type === 'check') {
            document.getElementById('target-list').innerHTML = '';
        }
        if (type === 'heal' || type === 'poison') {
            currentWitchAction = null;
            document.getElementById('target-list').innerHTML = '';
            document.getElementById('action-desc').innerText = "Ramuan telah digunakan. Menunggu...";
        }
    }

    function useWitchPotion(type) {
        if (witchUsed) return alert("Ramuan sudah habis!");
        
        currentWitchAction = type;
        const actionDesc = document.getElementById('action-desc');
        actionDesc.innerText = type === 'heal' ? "Pilih siapa yang mau disembuhkan:" : "Pilih siapa yang mau diracuni:";
        
        if (window.lastRoomState) {
            renderTargets(window.lastRoomState, type, false);
        }
    }

    function sendVote(targetId) {
        if (hasVoted) return;
        hasVoted = true;
        socket.emit('voteAction', targetId);
        document.getElementById('target-list').innerHTML = '<div style="padding:10px;color:#888;text-align:center;">Menunggu pemain lain...</div>';
    }

    function sendChat() {
        const input = document.getElementById('chat-input');
        const msg = input.value.trim();
        if (!msg) return;
        socket.emit('chatMessage', msg);
        input.value = '';
    }

    socket.on('roomUpdate', (room) => {
        window.lastRoomState = room;
        isHost = room.hostId === myId;
        
        const me = room.players.find(p => p.id === myId);
        if (me) witchUsed = me.witchUsed;

        document.getElementById('menu-section').classList.add('hidden');

        if (room.phase === 'lobby') {
            document.getElementById('lobby-section').classList.remove('hidden');
            document.getElementById('game-section').classList.add('hidden');
            document.getElementById('chat-section').classList.add('hidden');
            document.getElementById('room-code-display').innerText = room.roomCode;

            document.getElementById('player-list').innerHTML = room.players.map(p => 
                `<div class="player ${p.alive ? '' : 'dead'}">
                    <div class="player-info">
                        <span class="player-avatar">${p.avatar}</span>
                        <span>${p.name}</span>
                        ${p.id===myId?'<span class="badge badge-you">Kamu</span>':''}
                        ${p.id===room.hostId?'<span class="badge badge-host">Host</span>':''}
                    </div>
                </div>`
            ).join('');

            document.getElementById('start-btn').classList.toggle('hidden', !isHost);
            document.getElementById('waiting-msg').classList.toggle('hidden', isHost);
            stopTimerUI();
        } else {
            document.getElementById('lobby-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            document.getElementById('chat-section').classList.remove('hidden');

            if (room.timerEnd && room.phase !== 'end') startTimerUI(room.timerEnd, room.timerDuration);
            else stopTimerUI();

            updateGameUI(room);
            updateChatTabs(room);
        }
    });

    socket.on('gameStarted', (data) => {
        const me = data.players.find(p => p.id === myId);
        if (me) {
            let color = '#22c55e';
            if (me.role === 'Werewolf') color = '#ef4444';
            if (me.role === 'Penyihir') color = '#a855f7';
            if (me.role === 'Peramal') color = '#3b82f6';
            document.getElementById('role-info').innerHTML = `Peranmu: <b style="color:${color}">${me.role}</b>`;
        }
        hasVoted = false;
        currentWitchAction = null;
        witchUsed = false;
        
        document.getElementById('log-area').innerHTML = '';
        document.getElementById('chat-messages').innerHTML = '';
        document.getElementById('play-again-btn').classList.add('hidden');
        document.getElementById('witch-panel').classList.add('hidden');
    });

    function updateGameUI(room) {
        const me = room.players.find(p => p.id === myId);
        if (!me) return;

        const title = document.getElementById('phase-title');
        const actionArea = document.getElementById('action-area');
        const targetList = document.getElementById('target-list');
        const actionDesc = document.getElementById('action-desc');
        const witchPanel = document.getElementById('witch-panel');
        const btnHeal = document.getElementById('btn-heal');
        const btnPoison = document.getElementById('btn-poison');

        if (me.role === 'Penyihir' && me.alive && room.phase === 'night' && !witchUsed) {
            witchPanel.classList.remove('hidden');
            btnHeal.disabled = witchUsed;
            btnPoison.disabled = witchUsed;
        } else {
            witchPanel.classList.add('hidden');
        }

        if (room.phase === 'night') {
            title.innerText = `🌙 Malam ke-${room.nightCount}`;
            actionArea.classList.remove('hidden');
            
            if (!me.alive) {
                actionDesc.innerText = "Kamu sudah mati."; targetList.innerHTML = "";
            } else if (me.role === 'Werewolf') {
                actionDesc.innerText = "Pilih korban (Bunuh):";
                if(targetList.innerHTML === "") renderTargets(room, 'kill', true);
            } else if (me.role === 'Penyihir') {
                if (!currentWitchAction && targetList.innerHTML === "") {
                    actionDesc.innerText = "Pilih ramuan di atas, atau istirahat.";
                }
            } else if (me.role === 'Peramal') {
                actionDesc.innerText = "Pilih siapa yang mau diperiksa:";
                if(targetList.innerHTML === "") renderTargets(room, 'check', false);
            } else {
                actionDesc.innerText = "Kamu tidur. Tutup matamu...";
                targetList.innerHTML = "";
            }
        } 
        else if (room.phase === 'day') {
            title.innerText = `☀️ Siang ke-${room.nightCount} (Diskusi)`;
            actionArea.classList.add('hidden');
        } 
        else if (room.phase === 'vote') {
            title.innerText = `🗳️ Waktunya Voting!`;
            actionArea.classList.remove('hidden');
            if (room.votes[myId]) hasVoted = true; else hasVoted = false;

            if (!me.alive) {
                actionDesc.innerText = "Kamu sudah mati."; targetList.innerHTML = "";
            } else if (hasVoted) {
                actionDesc.innerText = "Kamu sudah vote. Menunggu...";
                targetList.innerHTML = "";
            } else {
                actionDesc.innerText = "Pilih siapa yang mau digantung:";
                renderTargets(room, 'vote', false);
            }
        } 
        else if (room.phase === 'end') {
            title.innerText = `🏁 GAME OVER`;
            actionArea.classList.add('hidden');
            witchPanel.classList.add('hidden');
            document.getElementById('play-again-btn').classList.toggle('hidden', !isHost);
        }
    }

    function renderTargets(room, actionType, excludeWolves) {
        const targetList = document.getElementById('target-list');
        targetList.innerHTML = "";
        let count = 0;

        room.players.forEach(p => {
            if (!p.alive || p.id === myId) return;
            if (excludeWolves && p.role === 'Werewolf') return;
            count++;
            const div = document.createElement('div');
            div.className = 'player';
            
            let btnHtml = '';
            if (actionType === 'vote') {
                btnHtml = `<button class="target-btn" onclick="sendVote('${p.id}')">Vote</button>`;
            } else {
                btnHtml = `<button class="target-btn" onclick="sendAction('${actionType}','${p.id}')">Pilih</button>`;
            }

            div.innerHTML = `
                <div class="player-info"><span class="player-avatar">${p.avatar}</span><span>${p.name}</span></div>
                ${btnHtml}
            `;
            targetList.appendChild(div);
        });

        if (count === 0) targetList.innerHTML = `<div style="padding:10px;color:#888;text-align:center;">Tidak ada target.</div>`;
    }

    function startTimerUI(endTs, durationSec) {
        stopTimerUI();
        document.getElementById('timer-bar').classList.remove('hidden');
        const tick = () => {
            const remaining = Math.max(0, Math.ceil((endTs - Date.now()) / 1000));
            const pct = durationSec > 0 ? (remaining / durationSec) * 100 : 0;
            document.getElementById('timer-fill').style.width = pct + '%';
            document.getElementById('timer-text').textContent = remaining + 's';
            const bar = document.getElementById('timer-bar');
            if (remaining <= 10) bar.classList.add('urgent');
            else bar.classList.remove('urgent');
            if (remaining <= 0) stopTimerUI();
        };
        tick();
        timerInterval = setInterval(tick, 200);
    }

    function stopTimerUI() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        document.getElementById('timer-bar').classList.add('hidden');
        document.getElementById('timer-fill').style.width = '100%';
    }

    function updateChatTabs(room) {
        const me = room.players.find(p => p.id === myId);
        if (!me) return;
        const label = document.getElementById('chat-channel-label');
        if (me.alive) {
            if (room.phase === 'night') {
                if (me.role === 'Werewolf') label.textContent = '🐺 WEREWOLF';
                else if (me.role === 'Penyihir' || me.role === 'Peramal') label.textContent = '🔮 SPECIAL';
                else label.textContent = 'PUBLIK (MUTE)';
            } else label.textContent = 'PUBLIK';
        } else label.textContent = '💀 MATI';
    }

    function addLog(msg, color = '#4ade80') {
        const log = document.getElementById('log-area');
        log.innerHTML += `<div style="color:${color}; margin-bottom:5px;">> ${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    socket.on('actionConfirmed', (msg) => addLog(msg));
    socket.on('seerResult', ({ name, role }) => {
        const color = role === 'Werewolf' ? '#ef4444' : '#22c55e';
        addLog(`🔮 Hasil ramalan: ${name} adalah ${role}!`, color);
    });

    socket.on('nightResult', ({ deaths, saved }) => {
        document.getElementById('log-area').innerHTML = '';
        if (saved) addLog(`💚 Seseorang diselamatkan oleh Penyihir!`, '#3b82f6');
        
        if (deaths.length === 0) {
            addLog(`🌙 Tidak ada korban malam ini.`, '#facc15');
        } else {
            deaths.forEach(name => addLog(`🌙 ${name} ditemukan tewas.`, '#f87171'));
        }
        currentWitchAction = null;
    });

    socket.on('voteResult', ({ lynchedName, tie }) => {
        if (tie) addLog(`🗳️ Voting seri, tidak ada yang digantung.`, '#facc15');
        else if (lynchedName) addLog(`🗳️ ${lynchedName} digantung warga.`, '#f87171');
        hasVoted = false;
    });

    socket.on('errorMsg', (msg) => alert(msg));

    socket.on('gameOver', ({ winner, room }) => {
        document.getElementById('phase-title').innerText = `🏁 GAME OVER`;
        addLog(`🏆 Pemenang: ${winner}`, 'gold');
        document.getElementById('action-area').classList.add('hidden');
        document.getElementById('witch-panel').classList.add('hidden');
        stopTimerUI();

        const list = document.getElementById('target-list');
        list.innerHTML = "<h3 style='text-align:center; margin-bottom:10px;'>Semua Peran:</h3>" + room.players.map(p => 
            `<div class="player">
                <div class="player-info"><span class="player-avatar">${p.avatar}</span><span>${p.name} ${p.alive ? '' : '(mati)'}</span></div>
                <span style="color:${p.role==='Werewolf'?'#ef4444':p.role==='Penyihir'?'#a855f7':p.role==='Peramal'?'#3b82f6':'#22c55e'}; font-weight:bold;">${p.role}</span>
            </div>`
        ).join('');

        if (isHost) document.getElementById('play-again-btn').classList.remove('hidden');
    });

    socket.on('chatMessage', (entry) => {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = 'chat-msg ' + entry.channel;
        const icon = entry.channel === 'wolf' ? '🐺 ' : entry.channel === 'dead' ? '💀 ' : entry.channel === 'special' ? '🔮 ' : '';
        div.innerHTML = `<span class="sender">${icon}${entry.sender}</span><br>${entry.text}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });
</script>
</body>
</html>
